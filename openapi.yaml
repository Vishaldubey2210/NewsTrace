openapi: 3.0.3
info:
  title: NewsTrace Media Intelligence API
  version: 2.1.0
  description: Autonomous media profiling, NLP bias scoring, and network graphs.
paths:
  /api/health:
    get:
      summary: API Health Check
      responses:
        '200':
          description: Service is healthy
  /api/profile:
    post:
      summary: Profile a media outlet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outlet_name:
                  type: string
      responses:
        '200':
          description: Profiling result
