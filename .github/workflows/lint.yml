name: Code Quality & Style Enforcement

on:
  pull_request:
    branches: [ main ]

jobs:
  linter:
    name: Flake8 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - run: flake8 app tests --max-line-length=120
