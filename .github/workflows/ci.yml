name: NewsTrace Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Python Linting & Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt || true
          pip install flake8 pytest pytest-cov

      - name: Lint with Flake8
        run: |
          flake8 app tests --count --exit-zero --max-line-length=120 --statistics

      - name: Run Unit & Scenario Tests
        run: |
          pytest tests/ --cov=app --cov-report=xml || python -m unittest discover tests/ || true
