name: Release Drafter & Tagging

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

jobs:
  draft_release:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          disable-autolabeler: true
