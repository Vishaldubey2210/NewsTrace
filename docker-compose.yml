version: '3.8'

services:
  newstrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newstrace-engine
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - newstrace_data:/app/data
      - newstrace_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  newstrace_data:
  newstrace_logs:
